<script>
$(function(){

var chara_num = $(".flipsnap .item").length-1;

var flipsnap = Flipsnap('.flipsnap', {
    distance: 268
});

function getRequest(){
  if(location.search.length > 1) {
    var get = new Object();
    var ret = location.search.substr(1).split("&");
    for(var i = 0; i < ret.length; i++) {
      var r = ret[i].split("=");
      get[r[0]] = r[1];
    }
    return get;
  } else {
    return false;
  }
}

var get = getRequest();
if(get.c){
 flipsnap.moveToPoint(get.c,0);
}

var prev    = $( '.flip-prev' , this );
var next    = $( '.flip-next' , this );

var $next = $('.flip-prev').click(function() {
   flipsnap.toPrev();
});

var $prev = $('.flip-next').click(function() {
   flipsnap.toNext();
});

if(get.c){
 if(get.c==0) $next.hide();
 if(get.c==chara_num) $prev.hide();
}else{
 $next.hide();
}

flipsnap.element.addEventListener('fspointmove', function() {
    if(!flipsnap.hasNext()){
	 $prev.hide();
	}else{
	 $prev.show();
	}
    if(!flipsnap.hasPrev()){
	 $next.hide();
	}else{
	 $next.show();
	}
}, false);

})
</script>
